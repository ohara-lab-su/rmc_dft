[build-system]
requires = ["setuptools>=71.0", "coloredlogs"]
build-backend = "setuptools.build_meta"

[project]
name = "rmc-dft"
version = "0.7.12"

description = "Python tools for integrating Reverse Monte Carlo structural modeling with VASP-based first-principles calculations and molecular dynamics of amorphous materials."
authors = [
    { name = "Kengo NAKADA", email = "kengo.nakada@email.com" },
    { name = "Kentaro Kobayashi", email = "kobayashi@mat.shimane-u.ac.jp" }
]
readme = "README.md"
# requires-python = ">=3.8"
requires-python = ">=3.10"
dependencies = [
    # my-modules
    "xlogger-py",
    "packmol-util",
    "rmc-util",
    "vasp-util",
    # fnc
    "pymatgen",
    # basic
    "dataclasses",
    "coloredlogs",
    "colorlog",
    "pytest",
    "pytest-asyncio",
    "pyyaml",
    "toml",
    # "grpcio",
    "nest_asyncio",
    # pages
    "sphinx",
    "myst-parser",
    "sphinx-autobuild",
    "sphinx-rtd-theme",
    "sphinxcontrib-napoleon",
    "linkify-it-py"
]

[project.urls]
Homepage = "https://ohara-lab-su.github.io/rmc_dft/"
Documentation = "https://ohara-lab-su.github.io/rmc_dft/"
Repository = "https://github.com/ohara-lab-su/rmc_dft"
Issues = "https://github.com/ohara-lab-su/rmc_dft/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]

# ここでpytestのiniと同じようにオプションが書ける
# 例えばテストマーク、フィルタ、カバレッジなども追記可能

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
[project.scripts]
rmc_dft = "rmc_dft.install:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rmc_dft = ["scripts/**/*"]
