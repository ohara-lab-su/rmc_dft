# K.NAKADA, kengo.nakada@gmail.com

max_rmc_dft_loop: 20
N_tot: 400  # セルサイズ(for packmol)
rho_g_cm3: 7.35  # 質量密度
n_per_A3: 0.0915  # 数密度
element_info: ["Fe", "Si", "B"]
ratios: [80, 9, 11]  # 化学量論比
rmc_exp_filename: "ascast.xsq"

# ---------- RMC -----------
rmc_code: "RmcPot" # RMC code ClassNames
rmc_log_dir: "log" # LOG 保存
# rmc_log_dir: "rmc_log" # LOG 保存
# -------------------------
cfg_name: "aaa" # input_file: RMC: aaa.cfg
# element_info: "label.txt" # VASP4(Rmc.cfg) type --> VASP5 type

# ------- DFT (VASP) --------
dft_code: "Vasp" # VASP code ClassNames
dft_log_dir: "log" # LOG 保存 (for VASP)
# dft_log_dir: "vasp_log" # LOG 保存 (for VASP)
# -------------------------
vasp_name: "aaa" # input_file: VASP: aaa.vasp (for VASP)
# run_mode: "local"
run_mode: "mpi"


# RMCPOT path (パスが通ってなければフルパスで書く)
# rmc_bin: "/home/k/Downloads/Source_RMC_POT_lin_2023.1/rmcp.exe"
# rmc_bin: "/usr/local/src/RMCPOT/rmcp.exe"
rmc_bin: "rmcp.exe"

# VASP  path
# dft_bin: "/home/hpc/vasp/bin/vasp-gamma"
# dft_bin: "/home/k/Downloads/vasp.6.4.2/bin/vasp_gam"
# dft_bin: "vasp_gam"
# dft_bin: "vasp-gamma"  # hpcs
dft_bin: "vasp_std"

# mpi: "mpirun -np {num_procs} {os.path.expanduser('/home/hpc/vasp/bin/vasp')}"
mpi_cmd: "mpirun"

# MPI process 数
# num_procs: 1
num_procs: null

# mpi_flag
# mpi_flag: "-np"
mpi_flag: null

# default job_name
job_cmd: "qsub job_hpcs2024_node2.sh"

# 入力ファイルの自動セーブ(パラメーターの変更時)
auto_write: True