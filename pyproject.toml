[build-system]
requires = ["setuptools>=71.0","coloredlogs"]
build-backend = "setuptools.build_meta"

[project]
name = "rmc_vasp"
version = "0.2.1"

description = "rmc_vasp is a Python package for performing Reverse Monte Carlo modeling and ab initio molecular dynamics / relaxation using VASP code."
authors = [
    { name="Kengo NAKADA", email="kengo.nakada@email.com" },
    { name="Kentaro Kobayashi", email="kobayashi@mat.shimane-u.ac.jp"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["src"]

# ここでpytestのiniと同じようにオプションが書ける
# 例えばテストマーク、フィルタ、カバレッジなども追記可能

[tool.black]
line-length = 88

[tool.isort]
profile = "black"