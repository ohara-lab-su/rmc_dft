
# RMC_POT: aaa.cfg
cfg_name: "aaa"

# VASP: aaa.vasp
vasp_name: "aaa"

rmc_log_dir: "rmc_log"
vasp_log_dir: "vasp_log"

max_rmc_dft_loop: 10

# RMCPOT path
# パスが通ってなければフルパスで書く
# rmc_bin: "/home/k/Downloads/Source_RMC_POT_lin_2023.1/rmcp.exe"
# rmc_bin: "/usr/local/src/RMCPOT/rmcp.exe"
rmc_bin: "rmcp.exe"

# VASP  path
# vasp_bin: "/home/hpc/vasp/bin/vasp-gamma"
# vasp_bin: "/home/k/Downloads/vasp.6.4.2/bin/vasp_gam"
# vasp_bin: "/home/hpc/vasp/bin/vasp"
vasp_bin: "vasp_gam"

num_procs: 1

# mpi: "mpirun -np {num_procs} {os.path.expanduser('/home/hpc/vasp/bin/vasp')}"
mpi_cmd: "mpirun"

# mpi_flag
mpi_flag: "-np"

# default job_name
job_cmd: "qsub job_hpcs2024_node2.sh"

# 入力ファイルの自動セーブ(パラメーターの変更時)
auto_write: True